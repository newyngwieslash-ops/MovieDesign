[package]
name = "moviedesign"
version = "0.1.0"
description = "Local-first AI design workspace"
edition = "2021"

[lib]
name = "moviedesign_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "=2.14.0"
minisign-verify = "0.3"
base64 = "0.22"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
